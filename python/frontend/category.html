<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品分类 - NovaCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/category.css" />
  </head>
  <body class="page page-category">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>

    <header class="site-header">
      <div class="header-inner">
        <a href="/home" class="brand-wrapper" style="text-decoration:none">
          <h1 class="brand">
            <span class="brand-icon">✨</span>
            <span class="brand-text">NovaCart</span>
          </h1>
          <span class="brand-tagline">智能推荐 · 精选好物</span>
        </a>

        <nav class="main-nav">
          <a class="nav-item" href="/home">
            <span class="nav-icon">🏠</span><span>首页</span>
          </a>
          <a class="nav-item active" href="/category">
            <span class="nav-icon">📦</span><span>分类</span>
          </a>
          <a class="nav-item" href="/search">
            <span class="nav-icon">🔍</span><span>搜索</span>
          </a>
          <a class="nav-item" href="/user">
            <span class="nav-icon">👤</span><span>个人中心</span>
          </a>
          <a class="nav-item" href="/admin">
            <span class="nav-icon">🛡️</span><span>管理员</span>
          </a>
        </nav>

        <div class="header-actions">
          <div class="search-box">
            <input type="text" placeholder="搜索商品、品牌、类目" id="headerSearch" />
            <button class="search-btn" id="headerSearchBtn">🔍</button>
          </div>
        </div>
      </div>
    </header>

    <main class="category-layout">
      <!-- 左侧分类导航 -->
      <aside class="category-sidebar">
        <div class="sidebar-card">
          <h3 class="sidebar-title">📂 全部分类</h3>
          <nav class="category-nav" id="categoryNav">
            <button class="cat-nav-item active" data-category="all">全部商品</button>
          </nav>
        </div>

        <div class="sidebar-card">
          <h3 class="sidebar-title">💰 价格区间</h3>
          <div class="filter-group">
            <div class="price-range">
              <input type="number" placeholder="最低" id="minPrice" />
              <span>-</span>
              <input type="number" placeholder="最高" id="maxPrice" />
            </div>
            <button class="apply-filter-btn" id="applyPriceFilter">应用筛选</button>
          </div>
        </div>

        <div class="sidebar-card">
          <h3 class="sidebar-title">🏷 快速标签</h3>
          <div class="quick-tags" id="quickTags">
            <button class="quick-tag" data-tag="新品">新品</button>
            <button class="quick-tag" data-tag="旗舰">旗舰</button>
            <button class="quick-tag" data-tag="性价比">性价比</button>
            <button class="quick-tag" data-tag="办公">办公</button>
            <button class="quick-tag" data-tag="游戏">游戏</button>
            <button class="quick-tag" data-tag="降噪">降噪</button>
          </div>
        </div>
      </aside>

      <!-- 右侧商品区 -->
      <section class="category-content">
        <div class="category-header">
          <h2 class="category-title" id="currentCategory">全部商品</h2>
          <div class="sort-options">
            <span class="sort-label">排序：</span>
            <button class="sort-btn active" data-sort="default">综合</button>
            <button class="sort-btn" data-sort="price-asc">价格↑</button>
            <button class="sort-btn" data-sort="price-desc">价格↓</button>
            <button class="sort-btn" data-sort="stock">热度</button>
          </div>
        </div>

        <div class="product-grid" id="categoryProductGrid">
          <div class="loading-skeleton">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-section">
          <h4>关于我们</h4>
          <a href="#">公司简介</a>
          <a href="#">联系方式</a>
          <a href="#">加入我们</a>
        </div>
        <div class="footer-section">
          <h4>客户服务</h4>
          <a href="#">帮助中心</a>
          <a href="#">退换货政策</a>
          <a href="#">配送说明</a>
        </div>
        <div class="footer-section">
          <h4>商家服务</h4>
          <a href="#">商家入驻</a>
          <a href="#">广告服务</a>
          <a href="#">合作洽谈</a>
        </div>
        <div class="footer-section">
          <h4>关注我们</h4>
          <div class="social-links">
            <a href="#" class="social-link">微信</a>
            <a href="#" class="social-link">微博</a>
            <a href="#" class="social-link">抖音</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script src="/assets/common.js"></script>
    <script src="/assets/category.js"></script>
  </body>
</html>
