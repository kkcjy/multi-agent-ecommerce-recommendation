<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - NovaCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/user.css" />
  </head>
  <body class="page page-user">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>

    <!-- 头部导航 -->
    <header class="site-header">
      <div class="header-inner">
        <a href="/home" class="brand-wrapper" style="text-decoration:none">
          <h1 class="brand">
            <span class="brand-icon">✨</span>
            <span class="brand-text">NovaCart</span>
          </h1>
          <span class="brand-tagline">智能推荐 · 精选好物</span>
        </a>

        <nav class="main-nav">
          <a class="nav-item" href="/home"><span class="nav-icon">🏠</span><span>首页</span></a>
          <a class="nav-item" href="/category"><span class="nav-icon">📦</span><span>分类</span></a>
          <a class="nav-item" href="/search"><span class="nav-icon">🔍</span><span>搜索</span></a>
          <a class="nav-item active" href="/user"><span class="nav-icon">👤</span><span>个人中心</span></a>
        </nav>
      </div>
    </header>

    <main class="user-layout">
      <!-- ==================== 左侧边栏 ==================== -->
      <aside class="user-sidebar">

        <!-- 用户信息卡片 -->
        <div class="profile-card" id="profileCard">
          <div class="profile-avatar-wrapper">
            <div class="profile-avatar" id="profileAvatar">👤</div>
            <button class="avatar-edit-btn" id="avatarEditBtn" title="更换头像">📷</button>
          </div>
          <div class="profile-info">
            <h3 class="profile-name" id="profileName">用户</h3>
            <span class="profile-id" id="profileId"></span>
            <span class="profile-level" id="profileLevel">普通会员</span>
          </div>
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-num" id="statOrders">0</span>
              <span class="stat-label">全部订单</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="statFavorites">0</span>
              <span class="stat-label">收藏商品</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="statHistory">0</span>
              <span class="stat-label">浏览记录</span>
            </div>
          </div>
          <button class="edit-profile-btn" id="editProfileBtn">编辑资料</button>
        </div>

        <!-- 我的资产 -->
        <div class="assets-card">
          <h3 class="sidebar-title">💰 我的资产</h3>
          <div class="assets-grid">
            <div class="asset-item">
              <span class="asset-icon">🎫</span>
              <span class="asset-num" id="couponCount">0</span>
              <span class="asset-label">优惠券</span>
            </div>
            <div class="asset-item">
              <span class="asset-icon">⭐</span>
              <span class="asset-num" id="pointsBalance">0</span>
              <span class="asset-label">积分</span>
            </div>
            <div class="asset-item">
              <span class="asset-icon">💳</span>
              <span class="asset-num" id="balanceAmount">¥0</span>
              <span class="asset-label">余额</span>
            </div>
          </div>
        </div>

        <!-- 快捷操作 -->
        <div class="sidebar-card">
          <h3 class="sidebar-title">⚡ 快捷操作</h3>
          <nav class="quick-actions">
            <button class="quick-action-item" id="addressBtn">
              <span>📍</span><span>收货地址</span><span class="qa-arrow">›</span>
            </button>
            <button class="quick-action-item" id="securityBtn">
              <span>🔒</span><span>安全设置</span><span class="qa-arrow">›</span>
            </button>
            <button class="quick-action-item" id="couponBtn">
              <span>🎫</span><span>我的优惠券</span><span class="qa-arrow">›</span>
            </button>
            <a href="/home" class="quick-action-item">
              <span>🏠</span><span>回到首页</span><span class="qa-arrow">›</span>
            </a>
          </nav>
        </div>
      </aside>

      <!-- ==================== 右侧内容区 ==================== -->
      <section class="user-content">
        <!-- Tab 导航 -->
        <div class="content-tabs">
          <button class="content-tab active" data-tab="orders">
            <span class="tab-icon">📋</span>我的订单
          </button>
          <button class="content-tab" data-tab="favorites">
            <span class="tab-icon">❤️</span>我的收藏
          </button>
          <button class="content-tab" data-tab="history">
            <span class="tab-icon">👁️</span>浏览历史
          </button>
          <button class="content-tab" data-tab="recommend">
            <span class="tab-icon">✨</span>为你推荐
          </button>
        </div>

        <!-- ====== 订单 tab ====== -->
        <div class="tab-panel active" id="panel-orders">
          <!-- 订单状态子 tab -->
          <div class="order-status-tabs">
            <button class="status-tab active" data-status="all">全部</button>
            <button class="status-tab" data-status="pending_pay">待付款</button>
            <button class="status-tab" data-status="pending_ship">待发货</button>
            <button class="status-tab" data-status="pending_recv">待收货</button>
            <button class="status-tab" data-status="completed">已完成</button>
          </div>
          <div class="order-list" id="orderList">
            <div class="empty-state">
              <span class="empty-icon">📋</span>
              <p>还没有订单</p>
              <a href="/home" class="empty-link">去逛逛</a>
            </div>
          </div>
        </div>

        <!-- ====== 收藏 tab ====== -->
        <div class="tab-panel" id="panel-favorites">
          <div class="panel-toolbar">
            <span class="toolbar-hint" id="favCount">共 0 件商品</span>
            <button class="toolbar-btn" id="clearFavs">清空收藏</button>
          </div>
          <div class="product-grid" id="favoritesGrid">
            <div class="empty-state">
              <span class="empty-icon">❤️</span>
              <p>还没有收藏商品</p>
              <a href="/home" class="empty-link">去首页逛逛</a>
            </div>
          </div>
        </div>

        <!-- ====== 浏览历史 tab ====== -->
        <div class="tab-panel" id="panel-history">
          <div class="panel-toolbar">
            <span class="toolbar-hint" id="historyCount">共 0 条记录</span>
            <button class="toolbar-btn" id="clearHistory">清除全部</button>
          </div>
          <div class="history-timeline" id="historyTimeline">
            <div class="empty-state">
              <span class="empty-icon">👁️</span>
              <p>暂无浏览记录</p>
            </div>
          </div>
        </div>

        <!-- ====== 为你推荐 tab ====== -->
        <div class="tab-panel" id="panel-recommend">
          <div class="panel-toolbar">
            <span class="toolbar-hint">根据您的偏好智能推荐</span>
            <button class="toolbar-btn" id="refreshRec">🔄 换一批</button>
          </div>
          <div class="product-grid" id="recommendGrid">
            <div class="loading-skeleton">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ==================== 地址管理弹窗 ==================== -->
    <div class="modal-overlay" id="addressModal">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3>📍 收货地址</h3>
          <button class="modal-close" id="closeAddressModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="address-list" id="addressList">
            <div class="empty-state">暂无地址，请添加</div>
          </div>
          <form class="address-form" id="addressForm">
            <input type="hidden" id="addrId" />
            <label>收货人</label>
            <input type="text" id="addrName" placeholder="请输入收货人姓名" required />
            <label>手机号</label>
            <input type="tel" id="addrPhone" placeholder="请输入手机号" required />
            <label>所在地区</label>
            <div class="addr-region">
              <input type="text" id="addrProvince" placeholder="省份" required />
              <input type="text" id="addrCity" placeholder="城市" required />
              <input type="text" id="addrDistrict" placeholder="区县" required />
            </div>
            <label>详细地址</label>
            <input type="text" id="addrDetail" placeholder="街道、门牌号等" required />
            <div class="addr-default">
              <input type="checkbox" id="addrDefault" />
              <label for="addrDefault">设为默认地址</label>
            </div>
            <button type="submit" class="addr-save-btn">保存地址</button>
          </form>
        </div>
      </div>
    </div>

    <!-- ==================== 编辑资料弹窗 ==================== -->
    <div class="modal-overlay" id="profileModal">
      <div class="modal-dialog modal-sm">
        <div class="modal-header">
          <h3>编辑资料</h3>
          <button class="modal-close" id="closeProfileModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="avatar-picker" id="avatarPicker">
            <button class="avatar-option" data-avatar="👤">👤</button>
            <button class="avatar-option" data-avatar="😊">😊</button>
            <button class="avatar-option" data-avatar="😎">😎</button>
            <button class="avatar-option" data-avatar="🦊">🦊</button>
            <button class="avatar-option" data-avatar="🐱">🐱</button>
            <button class="avatar-option" data-avatar="🐼">🐼</button>
            <button class="avatar-option" data-avatar="🦁">🦁</button>
            <button class="avatar-option" data-avatar="🐰">🐰</button>
          </div>
          <label>昵称</label>
          <input type="text" id="profileNameInput" placeholder="请输入昵称" maxlength="12" />
          <button class="addr-save-btn" id="saveProfileBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- ==================== 优惠券弹窗 ==================== -->
    <div class="modal-overlay" id="couponModal">
      <div class="modal-dialog modal-sm">
        <div class="modal-header">
          <h3>🎫 我的优惠券</h3>
          <button class="modal-close" id="closeCouponModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="coupon-list" id="couponList">
            <div class="empty-state">暂无优惠券</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/assets/user.js"></script>
  </body>
</html>
