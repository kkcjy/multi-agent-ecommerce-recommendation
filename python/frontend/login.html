<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - NovaCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="page page-login">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>

    <main class="login-layout">
      <section class="login-brand-panel reveal">
        <a href="/home" class="login-logo" aria-label="NovaCart 首页">
          <span class="login-logo-icon">✨</span>
          <span>NovaCart</span>
        </a>
        <h1>欢迎登录智能电商推荐系统</h1>
        <p>普通用户使用原项目预置画像账号登录；管理员进入控制台查看实验、指标和商品运营数据。</p>
        <div class="login-feature-grid">
          <div><strong>画像用户</strong><span>张伟、李明、王芳等原项目预置用户</span></div>
          <div><strong>管理员身份</strong><span>监控 Agent、管理 A/B 实验、查看运营概览</span></div>
        </div>
      </section>

      <section class="login-card reveal delay-1">
        <div class="login-card-head">
          <h2>账号登录</h2>
          <p>请选择登录身份</p>
        </div>

        <div class="role-tabs" role="tablist" aria-label="登录身份">
          <button class="role-tab active" type="button" data-role="user">普通用户</button>
          <button class="role-tab" type="button" data-role="admin">管理员</button>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            账号
            <input id="loginAccount" type="text" value="demo_tech" autocomplete="username" required />
          </label>
          <label>
            密码
            <input id="loginPassword" type="password" value="123456" autocomplete="current-password" required />
          </label>
          <button id="loginSubmit" type="submit">登录</button>
        </form>

        <div id="loginState" class="status subtle">普通用户请选择下方原项目预置画像账号，统一密码 123456；管理员：admin / admin123456</div>

        <div class="demo-account-box">
          <h3>原项目预置用户</h3>
          <button type="button" class="demo-account" data-role="user" data-account="demo_tech" data-password="123456"><strong>🧑‍💻 数码极客·张伟</strong><span>demo_tech / 123456</span></button>
          <button type="button" class="demo-account" data-role="user" data-account="demo_student" data-password="123456"><strong>🎓 校园达人·李明</strong><span>demo_student / 123456</span></button>
          <button type="button" class="demo-account" data-role="user" data-account="demo_worker" data-password="123456"><strong>👩‍💼 都市白领·王芳</strong><span>demo_worker / 123456</span></button>
          <button type="button" class="demo-account" data-role="user" data-account="demo_sport" data-password="123456"><strong>🏃 运动达人·赵强</strong><span>demo_sport / 123456</span></button>
          <button type="button" class="demo-account" data-role="user" data-account="demo_newbie" data-password="123456"><strong>🌟 萌新用户·陈静</strong><span>demo_newbie / 123456</span></button>
          <button type="button" class="demo-account" data-role="user" data-account="demo_return" data-password="123456"><strong>🔄 回归用户·刘洋</strong><span>demo_return / 123456</span></button>
          <button type="button" class="demo-account" data-role="admin" data-account="admin" data-password="admin123456"><strong>管理员</strong><span>admin / admin123456</span></button>
        </div>
      </section>
    </main>

    <script src="/assets/common.js"></script>
    <script src="/assets/login.js"></script>
  </body>
</html>
